spring:
  application:
    name: employee-leave-tracker

  # Every value uses the ${ENV_VAR:default} form.
  # - Inside Docker, docker-compose injects the env vars and the host is `db`.
  # - Running locally with `mvn spring-boot:run`, the defaults point at localhost.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leave_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # `update` lets Hibernate create and alter the tables directly from the @Entity
      # classes at startup, so the application runs against an empty database with no
      # migration step. That is why this project has no schema files and no migration
      # tool - the entity classes ARE the schema definition.
      #
      # This is a deliberate trade-off for a small project that must start with one
      # command. It is not what you would run in production: `update` never drops or
      # renames anything, so the schema drifts silently and is not reviewable. The
      # production setup would be `ddl-auto: validate` alongside a migration tool such
      # as Flyway or Liquibase, where each schema change is an explicit, versioned file.
      ddl-auto: update
    # Log the SQL Hibernate generates. Useful while learning, and useful for the demo:
    # you can literally show the SELECT that a REST call produced.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # Turn OFF the "open session in view" pattern.
    # With it ON (the Spring Boot default), the Hibernate session stays open until the
    # HTTP response is written, which hides LazyInitializationException bugs and holds a
    # DB connection for the whole request. With it OFF, every lazy association must be
    # resolved inside a @Transactional service method - which is where it belongs.
    open-in-view: false

server:
  port: 8080

# Custom application properties, bound via @Value.
app:
  leave:
    # How many days of leave one employee may take per calendar year.
    #
    # A configuration value rather than a constant in the code: an entitlement is a
    # company policy, and policies change. Changing it here (or via the
    # LEAVE_ANNUAL_ENTITLEMENT_DAYS environment variable) needs no recompile.
    annual-entitlement-days: ${LEAVE_ANNUAL_ENTITLEMENT_DAYS:27}

  # The company's timezone, used to decide what "today" is.
  #
  # A Docker container with no TZ set runs on UTC. In Dhaka (UTC+6) that means
  # LocalDate.now() still reports YESTERDAY between midnight and 6am - long enough
  # for an employee working late to book leave for a day that has already passed.
  # "Today" for a leave policy is a fact about where the company is, so it is
  # configured here rather than inherited from whichever machine runs the container.
  timezone: ${APP_TIMEZONE:Asia/Dhaka}

  jwt:
    # DEVELOPMENT DEFAULT ONLY - overridden by the JWT_SECRET env var in docker-compose.
    # HS256 requires a key of at least 256 bits (32 bytes); this string is comfortably longer.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789abcdef}
    # 24 hours in milliseconds.
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.misl.leavetracker: DEBUG
