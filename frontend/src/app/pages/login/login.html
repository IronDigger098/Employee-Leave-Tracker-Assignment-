<div class="login-wrapper">
  <div class="card login-card">
    <h1 class="login-title">Employee Leave Tracker</h1>
    <p class="login-subtitle">Sign in to continue</p>

    <!--
      [formGroup] binds this <form> to the FormGroup in the component.
      (ngSubmit) fires on submit; Angular prevents the default page reload.
    -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Email</label>
        <!-- formControlName links this input to form.controls.email -->
        <input id="email" type="email" formControlName="email" autocomplete="username" />
        @if (hasError('email')) {
          <small class="field-error">Enter a valid email address</small>
        }
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
        @if (hasError('password')) {
          <small class="field-error">Password is required</small>
        }
      </div>

      @if (errorMessage()) {
        <div class="alert alert-error">{{ errorMessage() }}</div>
      }

      <!-- Disabled while the request is in flight, so a double click cannot send two logins -->
      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
        {{ submitting() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <div class="demo-credentials">
      <strong>Demo credentials</strong>
      <div><code>admin&#64;misl.com</code> / <code>admin123</code> &mdash; Admin</div>
      <div><code>rahim&#64;misl.com</code> / <code>employee123</code> &mdash; Employee</div>
    </div>
  </div>
</div>
