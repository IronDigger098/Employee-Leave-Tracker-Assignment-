# =============================================================================
#  nginx configuration for the frontend container.
#
#  It does two jobs, and the second one is the important architectural decision
#  in this project.
# =============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    #  JOB 1: reverse-proxy the API.
    #
    #  Anything starting with /api/ is forwarded to the backend container. The
    #  hostname "backend" is not DNS magic - it is the SERVICE NAME from
    #  docker-compose.yml, which Docker's embedded DNS resolves to that
    #  container's IP on the shared network. This is why the backend must never
    #  be addressed as "localhost" from here: inside this container, localhost
    #  means nginx itself.
    #
    #  The consequence: the browser only ever talks to one origin
    #  (localhost:4200). It never sees port 8080. Same-origin means the browser
    #  applies no cross-origin rules, which is why there is NO CORS
    #  configuration anywhere in this project. Calling the backend directly from
    #  the browser would have required @CrossOrigin or a CorsConfigurationSource
    #  on the Spring side, plus preflight OPTIONS handling.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080;

        # Pass the original request details through, so the backend logs and any
        # future redirect logic see the real client rather than nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The Authorization header carrying the JWT is forwarded automatically -
        # nginx passes unknown headers through untouched.
    }

    # -------------------------------------------------------------------------
    #  JOB 2: the single-page-application fallback.
    #
    #  Angular does client-side routing: /admin/employees exists only in the
    #  browser's router, not as a file on disk. A normal nginx would return 404
    #  for it - and it would work when you CLICK a link (no server request) but
    #  break on refresh or on a pasted URL. That inconsistency is the classic
    #  "works until you press F5" SPA bug.
    #
    #  try_files says: serve the real file if it exists, otherwise serve
    #  index.html and let Angular's router read the URL and decide.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build artifacts (main-VFOLU55Y.js) get a new filename whenever their
    # content changes, so they can be cached hard and forever without risk of
    # serving a stale bundle. index.html is deliberately NOT cached this way -
    # it is the file that points at the current hashes.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
